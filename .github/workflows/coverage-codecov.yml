name: Fast PR Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  changed-logic:
    name: Changed Logic and Coverage
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      TEST_CONCURRENCY: "8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Prepare test environment
        run: |
          cp .env.example .env
          while IFS='=' read -r key value; do
            case "$key" in
              ""|\#*) continue ;;
            esac
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run changed logic and feature dependents
        run: bun run test:changed --timeout=30000

      - name: Enforce changed logic coverage
        run: bun run test:coverage:changed --timeout=30000

      - name: Verify LCOV output
        run: |
          test -s coverage/lcov.info
          ls -lh coverage/lcov.info

      - name: Upload changed logic coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: logic
          name: logic-coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce test policy
        run: bun run test:policy

  functional-smoke:
    name: Affected Functional Smoke
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      FUNCTIONAL_TEST_MODE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Prepare test environment
        run: |
          cp .env.example .env
          while IFS='=' read -r key value; do
            case "$key" in
              ""|\#*) continue ;;
            esac
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env
          echo "FUNCTIONAL_TEST_AUTH_SECRET=$(openssl rand -hex 32)" \
            >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Run affected smoke tests
        run: bun run test:functional

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-functional-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
