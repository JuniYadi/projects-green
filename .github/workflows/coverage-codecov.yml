name: Fast PR Tests

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-logic:
    name: Changed Logic and Coverage
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: UTC
      TEST_CONCURRENCY: "8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Prepare test environment
        run: |
          cp .env.example .env
          while IFS='=' read -r key value; do
            case "$key" in
              ""|\#*) continue ;;
            esac
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Enforce changed logic coverage
        if: ${{ github.event_name == 'pull_request' }}
        run: bun run test:coverage:changed

      - name: Run full logic coverage
        if: ${{ github.event_name != 'pull_request' }}
        run: bun run test:coverage

      - name: Check LCOV output
        id: lcov
        run: |
          if test -s coverage/lcov.info; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls -lh coverage/lcov.info
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No non-empty LCOV output was generated for this test set."
          fi

      - name: Upload coverage to Codecov
        if: ${{ steps.lcov.outputs.available == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: coverage/lcov.info
          flags: ${{ github.event_name == 'push' && 'full-coverage-main' || 'changed-logic-pr' }}
          name: ${{ github.event_name == 'push' && 'main-push-coverage' || 'pr-changed-coverage' }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce test policy
        run: bun run test:policy
    name: Affected Functional Smoke
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: UTC
      FUNCTIONAL_TEST_MODE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Prepare test environment
        run: |
          cp .env.example .env
          while IFS='=' read -r key value; do
            case "$key" in
              ""|\#*) continue ;;
            esac
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env
          echo "FUNCTIONAL_TEST_AUTH_SECRET=$(openssl rand -hex 32)" \
            >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Run affected smoke tests
        run: bun run test:functional

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-functional-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
