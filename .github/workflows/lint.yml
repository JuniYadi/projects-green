name: Super-Linter

on:
  pull_request:

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          # v8.7.0 uses this config for both TYPESCRIPT_ES and TSX. The
          # config filename is resolved relative to LINTER_RULES_PATH.
          LINTER_RULES_PATH: .github/linters
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          # Both validators default to enabled. Do not mix explicit true and
          # false VALIDATE_* settings: Super-Linter rejects that configuration.
          # Keep the project's existing ESLint and Prettier checks while avoiding
          # repository-wide tools that reject unrelated legacy and dependency files.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          VALIDATE_TRIVY: false
          # actionlint/zizmor only run once a PR touches a workflow YAML file,
          # so they surface long-standing, repo-wide findings (unpinned actions,
          # missing persist-credentials: false) unrelated to that PR's diff.
          # Pinning every workflow action to a SHA is a separate follow-up, not
          # something one unrelated PR should be blocked on.
          VALIDATE_GITHUB_ACTIONS: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_MARKDOWN: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: false
