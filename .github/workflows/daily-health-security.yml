name: Daily Security & Health Sentinel

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: UTC
  CI: "true"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  API_TIMEOUT_MS: "1200000"
  GIT_EMAIL: 31454084+JuniYadi@users.noreply.github.com
  GIT_NAME: JuniYadi

jobs:
  code-health:
    name: Typecheck & Linter Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Prepare test env file from .env.example
        shell: bash
        run: |
          cp .env.example .env
          while IFS='=' read -r key value; do
            case "$key" in
              ""|\#*) continue ;;
            esac
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run Integrity Checks
        id: run-checks
        shell: bash
        run: |
          mkdir -p reports
          touch reports/typecheck.log reports/lint.log
          HAS_ERRORS=0

          echo "::group::Running Typecheck (tsc --noEmit)"
          if ! bun run typecheck > reports/typecheck.log 2>&1; then
            echo "::warning::Typecheck issues detected. Captured in reports/typecheck.log"
            tail -n 50 reports/typecheck.log
            HAS_ERRORS=1
          else
            echo "Typecheck passed successfully."
          fi
          echo "::endgroup::"

          echo "::group::Running ESLint (eslint)"
          if ! bun run lint > reports/lint.log 2>&1; then
            echo "::warning::ESLint issues detected. Captured in reports/lint.log"
            tail -n 50 reports/lint.log
            HAS_ERRORS=1
          else
            echo "ESLint passed successfully."
          fi
          echo "::endgroup::"

          if [ "$HAS_ERRORS" -ne 0 ]; then
            echo "Code health check finished with issues. Logged for automated triage."
          else
            echo "Code health check passed."
          fi

      - name: Upload Code Health Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-reports
          path: reports/
          retention-days: 7

  security-audit:
    name: Security & Vulnerability Audit (All Levels)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository (Full history for secret scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare reports directory
        run: |
          mkdir -p reports
          touch reports/trivy.log reports/gitleaks.log

      - name: Secret Scanning (Gitleaks)
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Collect Gitleaks Report
        if: always()
        shell: bash
        run: |
          if [ -f gitleaks-results.sarif ]; then
            cp gitleaks-results.sarif reports/
          fi

      - name: Dependency & File Vulnerability Scan (Trivy - All Levels)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "reports/trivy.log"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "0"

      - name: Display Trivy Report in Step Logs
        if: always()
        shell: bash
        run: |
          if [ -f reports/trivy.log ] && [ -s reports/trivy.log ]; then
            cat reports/trivy.log
          fi

      - name: Evaluate Security Severity Gate
        if: always()
        shell: bash
        run: |
          if [ -f reports/trivy.log ] && grep -E '(CRITICAL|HIGH)\s*\|' reports/trivy.log > /dev/null 2>&1; then
            echo "::warning::Actionable HIGH or CRITICAL security vulnerabilities detected. Logged for automated triage."
          fi

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 7

  ai-autofix-and-triage:
    name: AI Auto-Fix & Incident Triage
    needs: [code-health, security-audit]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_IDE_PROJECTS || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Prepare test env file from .env.example
        shell: bash
        run: |
          cp .env.example .env
          while IFS='=' read -r key value; do
            case "$key" in
              ""|\#*) continue ;;
            esac
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Download Health Reports
        uses: actions/download-artifact@v4
        with:
          name: health-reports
          path: reports/health
        continue-on-error: true

      - name: Download Security Reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: reports/security
        continue-on-error: true

      - name: Check for Sentinel Findings
        id: check-findings
        shell: bash
        run: |
          HAS_FINDINGS=0

          if [ -f reports/health/typecheck.log ] && grep -qE "error TS[0-9]+" reports/health/typecheck.log; then
            echo "Found TypeScript typecheck errors"
            HAS_FINDINGS=1
          fi

          if [ -f reports/health/lint.log ] && grep -qE "([0-9]+ problem|[0-9]+ error)" reports/health/lint.log; then
            echo "Found ESLint errors"
            HAS_FINDINGS=1
          fi

          if [ -f reports/security/trivy.log ] && grep -qE '(CRITICAL|HIGH|MEDIUM|LOW)\s*\|' reports/security/trivy.log; then
            echo "Found Trivy vulnerability findings"
            HAS_FINDINGS=1
          fi

          if [ -f reports/security/gitleaks-results.sarif ] && [ -s reports/security/gitleaks-results.sarif ]; then
            echo "Found Gitleaks SARIF report"
            HAS_FINDINGS=1
          fi

          if [ "$HAS_FINDINGS" -eq 1 ]; then
            echo "findings_detected=true" >> "$GITHUB_OUTPUT"
            echo "Actionable sentinel findings detected. Dispatching AI Auto-Fix & Incident Triage."
          else
            echo "findings_detected=false" >> "$GITHUB_OUTPUT"
            echo "All health and security checks are clean. No triage needed."
          fi

      - name: Claude Code — Auto-Fix & Triage
        if: steps.check-findings.outputs.findings_detected == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_IDE_PROJECTS || secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          track_progress: false
          show_full_output: false
          display_report: true
          plugin_marketplaces: "https://github.com/DietrichGebert/ponytail.git"
          plugins: "ponytail@ponytail"
          claude_args: >-
            --model ${{ secrets.FIX_ANTHROPIC_MODEL || secrets.ANTHROPIC_MODEL || 'claude-3-7-sonnet-20250219' }}
            --max-turns 100
            --allowedTools "Bash(bun*),Bash(node*),Bash(npx*),Bash(git*),Bash(gh*),Bash(cat*),Bash(find*),Bash(grep*),Bash(ls*),Bash(cp*),Bash(mv*),Bash(rm*),Bash(sed*),Bash(mkdir*),Bash(touch*),Bash(tee*),Bash(date*),Bash(which*),Bash(dirname*),Bash(basename*),Bash(sort*),Bash(uniq*),mcp__github_*"
          prompt: |
            /ponytail:ponytail
            ROLE: Staff Engineer & Security Sentinel for projects-green.
            The daily automated security & health sentinel detected issues.

            DIAGNOSTICS:
            Check available report files:
            - reports/health/typecheck.log (TypeScript compiler errors)
            - reports/health/lint.log (ESLint errors)
            - reports/security/trivy.log (Vulnerability scanner findings - all severities)
            - reports/security/gitleaks-results.sarif (Gitleaks scanner findings)

            TASK 1: AUTO-FIX FOR CODE HEALTH (Typecheck & ESLint)
            If typecheck or ESLint failures exist in reports/health/:
            1. Configure git identity:
               ```bash
               git config user.name "JuniYadi"
               git config user.email "31454084+JuniYadi@users.noreply.github.com"
               ```
            2. Create an autofix branch:
               ```bash
               BRANCH_NAME="fix/sentinel-$(date +%Y%m%d-%H%M)"
               git checkout -b "$BRANCH_NAME"
               ```
            3. Fix the specific type or lint errors in the affected files.
               Respect repo conventions in AGENTS.md:
               - Strict types, 2-space indent, no semicolons, double quotes, @/* imports.
               - Prisma types must come from @prisma/client.
            4. Verify fixes locally:
               ```bash
               bun run typecheck
               bun run lint
               ```
            5. If clean and diff exists:
               ```bash
               git add -A
               git commit -m "fix(sentinel): resolve daily typecheck/lint errors [$(date +%Y-%m-%d)]"
               git push -u origin "$BRANCH_NAME"
               gh pr create --title "fix(sentinel): resolve daily typecheck/lint errors [$(date +%Y-%m-%d)]" \
                            --body "### Daily Sentinel Auto-Fix

               Automated fix generated by Daily Sentinel for detected code health failures.

               **Validated:**
               - [x] \`bun run typecheck\` passed
               - [x] \`bun run lint\` passed" \
                            --base main --head "$BRANCH_NAME"
               ```

            TASK 2: TRIAGE & ISSUE DISPATCH FOR SECURITY FINDINGS
            If security vulnerabilities (Trivy report) or leaked secrets are detected:
            1. Parse the findings from reports/security/trivy.log and secret findings.
            2. Categorize by severity: UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL.
            3. Check if an open issue already exists for Sentinel alerts:
               ```bash
               EXISTING_ISSUE=$(gh issue list --state open --search "Security Sentinel" --json number,title --jq '.[0].number')
               ```
            4. If an open issue exists, post a comment with the latest scan update:
               ```bash
               gh issue comment "$EXISTING_ISSUE" --body "### Daily Security Scan Update ($(date -u +'%Y-%m-%d %H:%M UTC'))

               #### Findings Summary
               \`\`\`
               $(cat reports/security/trivy.log 2>/dev/null | head -n 40 || echo "See security audit logs")
               \`\`\`"
               ```
            5. If no open issue exists, open a new GitHub Issue using `gh issue create`:
               ```bash
               gh issue create --title "[Security Sentinel] Daily Vulnerability Alert - $(date +%Y-%m-%d)" \
                               --body "### Daily Security Scan Findings

               **Scan Date:** $(date -u +'%Y-%m-%d %H:%M UTC')

               #### Summary of Findings
               Review the attached log or table below for identified CVEs across all severity levels:

               \`\`\`
               $(cat reports/security/trivy.log 2>/dev/null | head -n 40 || echo "See security audit logs")
               \`\`\`

               #### Recommended Next Steps
               - Review vulnerable dependencies and update lockfile where non-breaking patches are available.
               - Investigate any critical/high CVEs for impact on production deployment."
               ```

            Complete both tasks thoroughly and exit 0 once actions have been dispatched.
