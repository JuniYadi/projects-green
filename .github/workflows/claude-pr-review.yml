name: Claude Auto Review with Tracking
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Skip fix PRs
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$AUTHOR" == "github-actions[bot]" ]; then
            echo "Skipping: Fix PR created by bot"
            exit 0
          fi

          if [[ "$BRANCH" == fix/pr-* ]]; then
            echo "Skipping: Fix PR branch"
            exit 0
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Prepare test env file from .env.example
        run: |
          cp .env.example .env
          for line in $(grep -v '^#' .env | grep '='); do
            key=$(echo "$line" | cut -d'=' -f1)
            value=$(echo "$line" | cut -d'=' -f2- | sed 's/^"*//;s/"*$//')
            echo "${key}=${value}" >> $GITHUB_ENV
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Claude Code Review Loop
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          API_TIMEOUT_MS: "3000000"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          track_progress: true
          show_full_output: false
          display_report: true
          use_sticky_comment: true
          allowed_bots: "github-actions,claude"
          plugin_marketplaces: "https://github.com/DietrichGebert/ponytail.git"
          plugins: "ponytail@ponytail"
          claude_args: >-
            --model ${{ secrets.ANTHROPIC_MODEL }}
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api *)"
          prompt: |
            /ponytail:ponytail
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT ACTION: ${{ github.event.action }}

            SPEED & EFFICIENCY DIRECTIVE:
            - Complete the review swiftly and decisively in under 10 turns whenever possible.
            - Do not perform unnecessary tool loops or explore unedited files.

            SCOPE & PROPORTIONALITY (read this before anything else):
            - Only reference files and lines that appear in `gh pr diff`. Never comment on
              a file that has no hunk in this PR.
            - Run `gh pr diff ${{ github.event.pull_request.number }} --stat` first to inspect changed lines.
              - SMALL diff (roughly under 100 changed lines): give a fast, compact review in 2-4 turns.
                One short paragraph summary + only real blocking bugs. If there is nothing wrong, approve immediately.
              - LARGER diff: do a focused scan for real bugs, security flaws, or breaking regressions.
            - Every review MUST end with a formal verdict using `gh pr review`.

            ROLE & PERSONA:
            You are a sharp, pragmatic Staff Engineer reviewing pull requests.
            - Be concise, direct, and factual.
            - Do not invent speculative nitpicks or write lengthy essays for simple changes.

            INSTRUCTIONS:

            MANDATORY STEP 1 — GET PR DIFF:
            Run `gh pr diff ${{ github.event.pull_request.number }}` (exclude lockfiles and assets if any).
            This is your sole source of truth.

            MANDATORY STEP 2 — RECONCILE EXISTING THREADS:
            - If EVENT ACTION is "opened", SKIP checking existing review threads completely.
            - Otherwise, run `gh api graphql` to check open review threads. If none, proceed to code review.
              - For outdated or fixed threads: resolve via `resolveReviewThread`.
              - For still broken threads: mark as persistent.

            MANDATORY STEP 3 — REVIEW & SUBMIT VERDICT:
            - Check changed code for bugs or regressions.
            - For any genuine critical blocker on a changed line in the diff, use `mcp__github_inline_comment__create_inline_comment` or list it in `review_body.md`.
            - If no blocking issues:
              `gh pr review ${{ github.event.pull_request.number }} --approve --body "<2-3 sentence summary of change>"`
            - If blocking issues exist:
              Create `review_body.md` and execute:
              `gh pr review ${{ github.event.pull_request.number }} --request-changes -F review_body.md`
