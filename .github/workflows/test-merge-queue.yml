name: Merge Queue Logic Coverage

on:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-logic-coverage:
    name: Full Logic Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      TEST_CONCURRENCY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Prepare test environment
        run: |
          cp .env.example .env
          while IFS='=' read -r key value; do
            case "$key" in
              ""|\#*) continue ;;
            esac
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run full logic coverage quietly
        id: coverage
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          bun run test:coverage --timeout=30000 \
            > test-results/full-logic-coverage.log 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Full logic coverage passed."
            tail -n 25 test-results/full-logic-coverage.log
          else
            echo "Full logic coverage failed. Showing the final 300 lines."
            tail -n 300 test-results/full-logic-coverage.log
          fi

          exit "$status"

      - name: Verify LCOV output
        run: |
          test -s coverage/lcov.info
          ls -lh coverage/lcov.info

      - name: Upload full logic coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: logic
          name: logic-coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload full-suite failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-logic-coverage-failure
          path: |
            test-results/full-logic-coverage.log
            coverage/
          if-no-files-found: ignore
          retention-days: 14
