name: Docker Build & Push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - file: Dockerfile.web
            suffix: web
            build_args: |
              NEXT_PUBLIC_WORKOS_REDIRECT_URI=https://pfnapp.my.id/callback
          - file: Dockerfile.workers
            suffix: workers
            build_args: ""

    steps:
      - uses: actions/checkout@v7

      - id: image
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          repository="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repository}-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
