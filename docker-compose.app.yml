services:
  web:
    image: projects-green-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pfnapp-web
    restart: unless-stopped
    ports:
      - "3300:3300"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?schema=public
    env_file:
      - .env
    networks:
      - pfnapp-net

  workers:
    image: projects-green-workers:local
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: pfnapp-workers
    restart: unless-stopped
    stop_grace_period: 2m
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: '0.25'
          memory: 512M
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?schema=public
    env_file:
      - .env
    networks:
      - pfnapp-net

