[test]
preload = ["./test/register.ts"]
coverageReporter = ["lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
# No coverageThreshold: Codecov enforces 85% (codecov.yml). Bun's threshold
# was never applied under --isolate, but --parallel enforces it on every run.
coveragePathIgnorePatterns = [
  "**/*.tsx",
  "**/*.test.ts",
  "**/*.test.tsx",
  "test/**",
  "scripts/**",
  "**/*.d.ts",
  "**/fixtures/**",
  "**/generated/**",
  "**/prisma/**",
  "**/integration/**",
  "**/*.config.ts",
  "next.config.*",
  "**/vpn-server-ssh-executor.ts",
  "**/wireguard-ssh-adapter.ts",
  "**/proxy-ssh-adapter.ts",
  "**/paypal.provider.ts",
  "**/docs-embedding.service.ts",
]
