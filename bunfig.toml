[test]
coverageReporter = ["lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.85, functions = 0.85 }
coveragePathIgnorePatterns = [
  "**/*.tsx",
  "**/*.test.ts",
  "**/*.test.tsx",
  "test/**",
  "scripts/**",
  "**/*.d.ts",
  "**/fixtures/**",
  "**/generated/**",
  "**/prisma/**",
  "**/integration/**",
  "**/*.config.ts",
  "next.config.*",
  "**/vpn-server-ssh-executor.ts",
  "**/wireguard-ssh-adapter.ts",
  "**/proxy-ssh-adapter.ts",
  "**/paypal.provider.ts",
  "**/docs-embedding.service.ts",
]
