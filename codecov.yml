codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "70...90"

  status:
    project:
      logic:
        target: 85%
        threshold: 0%
        flags:
          - logic
        if_ci_failed: error
        informational: true
    patch:
      logic:
        target: 85%
        threshold: 0%
        flags:
          - logic
        informational: false

ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "test/**"
  - "scripts/**"
  - "**/*.tsx"
  - "**/*.d.ts"
  - "**/fixtures/**"
  - "**/generated/**"
  - "**/prisma/**"
  - "**/integration/**"
  - "**/_ops/**"
  - "**/vpn-server-ssh-executor.ts"
  - "**/wireguard-ssh-adapter.ts"
  - "**/proxy-ssh-adapter.ts"
  - "**/paypal.provider.ts"
  - "**/docs-embedding.service.ts"

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: true
