codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "70...90"

  status:
    project:
      default:
        informational: true
      full:
        target: 85%
        threshold: 0%
        flags:
          - full
        informational: true
    patch:
      changed:
        target: 85%
        threshold: 0%
        flags:
          - changed
        informational: false
flags:
  full:
    carryforward: true
  logic:
    carryforward: true
  changed:
    carryforward: false
  unit:
    carryforward: true
ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "test/**"
  - "scripts/**"
  - "**/*.tsx"
  - "**/*.d.ts"
  - "**/fixtures/**"
  - "**/generated/**"
  - "**/prisma/**"
  - "**/integration/**"
  - "**/_ops/**"
  - "**/vpn-server-ssh-executor.ts"
  - "**/wireguard-ssh-adapter.ts"
  - "**/proxy-ssh-adapter.ts"
  - "**/paypal.provider.ts"
  - "**/docs-embedding.service.ts"

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: true
  after_n_builds: 1
